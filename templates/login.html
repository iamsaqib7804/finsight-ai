<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FinSight AI</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23635bff'/><text x='50' y='68' font-size='60' font-weight='800' fill='white' text-anchor='middle' font-family='Arial'>F</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f6f7fb 0%, #eef0ff 100%);
      color: #18202b;
      display: grid; place-items: center; min-height: 100vh; padding: 20px;
    }
    .auth-card { background: #fff; padding: 40px; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(27,35,52,.12); width: min(440px, 100%); }
    .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .brand-mark { width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, #756bff, #a396ff);
      display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px; }
    .auth-card h1 { margin: 0; font-size: 22px; }
    .auth-card .sub { color: #7b8492; font-size: 12px; margin-top: 3px; }
    .auth-card p.intro { color: #7b8492; font-size: 12px; margin: 0 0 24px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px;
      background: #f0f1f5; padding: 4px; border-radius: 12px; }
    .auth-tabs button { flex: 1; padding: 10px; border-radius: 9px; border: 0;
      background: transparent; font-weight: 600; cursor: pointer;
      font: inherit; color: #69717f; }
    .auth-tabs button.active { background: #fff; color: #635bff;
      box-shadow: 0 2px 8px rgba(99,91,255,.15); }
    label { display: block; margin: 14px 0 6px; font-size: 11px; color: #66707d; font-weight: 600; }
    input { width: 100%; border: 1px solid #e9ebf0; border-radius: 10px;
      padding: 12px 14px; font: inherit; font-size: 13px; outline: none; }
    input:focus { border-color: #635bff; box-shadow: 0 0 0 3px rgba(99,91,255,.1); }
    .primary-btn { background: #635bff; color: #fff; padding: 13px; border-radius: 11px;
      font-weight: 700; font-size: 13px; border: 0; cursor: pointer; width: 100%;
      margin-top: 20px; }
    .primary-btn:hover { filter: brightness(.96); }
    .primary-btn:disabled { opacity: .6; cursor: not-allowed; }
    .error { background: #ffeaec; color: #d54152; padding: 10px 12px;
      border-radius: 10px; font-size: 11px; margin-top: 14px; display: none; }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand-row">
      <div class="brand-mark">F</div>
      <div><h1>FinSight AI</h1><div class="sub">Smart Expense Intelligence</div></div>
    </div>
    <p class="intro">Sign in or create an account to manage expenses with AI.</p>

    <div class="auth-tabs">
      <button id="tabLogin" class="active" type="button">Login</button>
      <button id="tabRegister" type="button">Register</button>
    </div>

    <form id="authForm">
      <div id="nameGroup" style="display:none">
        <label for="name">Full name</label>
        <input id="name" placeholder="Your name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Min 8 characters" required minlength="8">
      <div id="incomeGroup" style="display:none">
        <label for="income">Monthly income (optional)</label>
        <input id="income" type="number" placeholder="50000">
      </div>
      <button class="primary-btn" id="submitBtn" type="submit">Login</button>
      <div class="error" id="errorBox"></div>
    </form>
  </div>

  <script>
    let mode = 'login';
    const tabL = document.getElementById('tabLogin');
    const tabR = document.getElementById('tabRegister');
    const btn = document.getElementById('submitBtn');
    const nameGroup = document.getElementById('nameGroup');
    const incomeGroup = document.getElementById('incomeGroup');
    const errorBox = document.getElementById('errorBox');
    const form = document.getElementById('authForm');

    function getCsrfToken() {
      const meta = document.querySelector('meta[name="csrf-token"]');
      return meta ? meta.getAttribute('content') : '';
    }

    tabL.onclick = () => {
      mode = 'login';
      tabL.classList.add('active'); tabR.classList.remove('active');
      btn.textContent = 'Login';
      nameGroup.style.display = 'none';
      incomeGroup.style.display = 'none';
      errorBox.classList.remove('show');
    };
    tabR.onclick = () => {
      mode = 'register';
      tabR.classList.add('active'); tabL.classList.remove('active');
      btn.textContent = 'Create account';
      nameGroup.style.display = 'block';
      incomeGroup.style.display = 'block';
      errorBox.classList.remove('show');
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      btn.disabled = true;

      const body = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        name: document.getElementById('name').value.trim(),
        monthly_income: Number(document.getElementById('income').value) || 0
      };

      const url = mode === 'login' ? '/api/auth/login' : '/api/auth/register';

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken()
          },
          credentials: 'same-origin',
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');
        window.location.href = '/';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
